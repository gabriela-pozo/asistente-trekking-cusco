# Tema de Abra Travel. Colores y fuentes explicados en docs/diseno.md.

[client]
toolbarMode = "minimal"   # sin "Deploy" ni opciones de desarrollador

[theme]
# Paleta "Abra: del glaciar al amanecer" (docs/diseno.md). Los colores se repiten en app/estilo.css como variables.
base = "light"
primaryColor = "#0B6E7F"              # Laguna: botón principal y enlaces
backgroundColor = "#F5F1E8"           # Arena: fondo de página
secondaryBackgroundColor = "#FFFFFF"  # Nieve: tarjetas y campos
textColor = "#12303A"                 # Tinta
borderColor = "#DDD6C8"
linkColor = "#0B6E7F"
showSidebarBorder = false

font = "Nunito:https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
headingFont = "Montserrat:https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap"
baseFontSize = 16
headingFontSizes = ["32px", "24px", "18px", "16px", "16px", "14px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
metricValueFontSize = "36px"
metricValueFontWeight = 700
paddingTop = "1rem"
baseRadius = "12px"
buttonRadius = "12px"

# Semánticos. El texto usa el tono oscuro para llegar a 4,5:1 sobre su fondo.
redColor = "#B4471F"
redBackgroundColor = "#FBEDE8"
redTextColor = "#9A3A17"
orangeColor = "#B45F06"
orangeBackgroundColor = "#FFF1D6"
orangeTextColor = "#7A4B00"
yellowColor = "#B45F06"
yellowBackgroundColor = "#FFF1D6"
yellowTextColor = "#7A4B00"
greenColor = "#0E7C58"
greenBackgroundColor = "#E3F3EC"
greenTextColor = "#0A5F43"
# Informativo: Laguna suave.
blueColor = "#0B6E7F"
blueBackgroundColor = "#E2F1F4"
blueTextColor = "#12303A"
grayTextColor = "#4A5F66"

dataframeHeaderBackgroundColor = "#F5F1E8"
dataframeBorderColor = "#DDD6C8"

chartCategoricalColors = ["#0B6E7F", "#0E7C58", "#3A78C2", "#C8660A", "#5B6F6A", "#12303A"]
chartSequentialColors = ["#E2F1F4", "#C5E2E8", "#A6D2DA", "#86C1CC", "#66AFBD", "#459CAD", "#2A8899", "#0B6E7F", "#095866", "#0B2E3A"]

[theme.sidebar]
# Cumbre: la barra lateral es el bloque oscuro; el ítem activo va en Amanecer.
backgroundColor = "#0B2E3A"
secondaryBackgroundColor = "#123F4E"
textColor = "#E6F1F3"
primaryColor = "#F59E2E"
borderColor = "#1E5160"
